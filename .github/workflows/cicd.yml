name: BUILD_AND_TEST

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# Права на запись пакетов временно не требуются, так как пуш отключен
permissions:
  contents: read
  # packages: write

jobs:
  # =========================================================================
  # 1. ФАЗА ТЕСТИРОВАНИЯ
  # =========================================================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # КЭШИРОВАНИЕ: сохраняет скачанные NuGet-пакеты между запусками пайплайна
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ArticlesApp.slnx

      - name: Create empty .env file
        run: touch .env

      - name: Run All Tests
        run: dotnet test ArticlesApp.slnx --configuration Debug --verbosity normal

  # =========================================================================
  # 2. ФАЗА СБОРКИ РЕШЕНИЯ
  # =========================================================================
  build:
    name: Compile Solution (Release)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Повторно используем кэш, созданный на этапе тестирования
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.slnx', '**/*.csproj') }}

      - name: Restore dependencies
        run: dotnet restore ArticlesApp.slnx

      - name: Create empty .env file
        run: touch .env

      - name: Build Solution
        run: dotnet build ArticlesApp.slnx --no-restore --configuration Release

  # =========================================================================
  # 3. ФАЗА СБОРКИ DOCKER-ОБРАЗА
  # =========================================================================
  publish-image:
    name: Build Docker Image (Verify Only)
    needs: build
    runs-on: ubuntu-latest
    # env:
    #   REGISTRY: ghcr.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Временно отключаем логин в реестр GitHub Packages
      # - name: Log in to GitHub Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ env.REGISTRY }}
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      # Временно отключаем переменную нижнего регистра для имени владельца
      # - name: Convert repository owner to lowercase
      #   run: |
      #     echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
      #   env:
      #     OWNER: '${{ github.repository_owner }}'

      # Локальная сборка и тегирование образа (без отправки в интернет)
      - name: Build Articles API Image
        run: |
          docker build \
            -f ./src/ArticlesAPI/Dockerfile \
            -t articles-api:${{ github.sha }} \
            -t articles-api:latest .          
          # docker build \
          #   -f ./src/ArticlesAPI/ArticlesAPI/Dockerfile \
