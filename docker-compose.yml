name: atricles-system

services:
  articles-api:    
    image: ${DOCKER_REGISTRY-}articles-api
    container_name: articles_api
    build:
      context: .
      dockerfile: src/ArticlesAPI/Dockerfile
    ports:          
      - "${API_HTTP_PORT}:8080"  
      - "8081:8081" 
    env_file:
      - .env
    environment:       
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__BaseDbConnection=Host=${POSTGRES_HOST};Database=${POSTGRES_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - CacheSettings__RedisUrl=${REDIS_HOST}:6379,connectTimeout=5000,syncTimeout=5000,abortConnect=false
      - CacheSettings__UseDistributedCache=true
      # Переопределяем настройки для работы с HealthCheck UI (принудительно доверие внутреннему SSL-сертификату настроено в коде)
      - HealthChecksUI__HealthChecks__0__Name=API Health
      - HealthChecksUI__HealthChecks__0__Uri=https://articles-api:8081/health
      # Переопределяем URL сервера Seq
      - Serilog__WriteTo__2__Args__serverUrl=http://articles-app-seq:80
      # Переопределяем apiKey через переменные окружения
      - Serilog__WriteTo__2__Args__apiKey=${SEQ_API_KEY}
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy   
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && grep -q '200 OK' <&3"]      
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres_db:
    image: postgres:18-alpine
    container_name: postgres_db
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      # ЯВНО указываем путь к данным внутри контейнера (для решения проблемы создания анонимного тома для /var/lib/postgresql и несохранения данных в именованный том)
      PGDATA: /var/lib/postgresql/data/pgdata 
    volumes:
      # Монтируем в родительскую папку, чтобы захватить ВСЁ (для решения проблемы создания анонимного тома для /var/lib/postgresql и несохранения данных в именованный том)
      - postgres_data:/var/lib/postgresql 
    restart: unless-stopped  #always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_NAME}"]
      interval: 10s  
      timeout: 5s    
      retries: 5     
      start_period: 10s 

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      # Именованный том для настроек (обязательно этот путь!)
      - pgadmin_data:/var/lib/pgadmin
      # проброс файла серверов
      - ./pg-admin-servers.json:/pgadmin4/servers.json
    restart: unless-stopped #always
    healthcheck:
      # Проверяем главную страницу. Если вернула код 200 — значит "healthy"
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s      
      timeout: 5s         
      retries: 10         
      start_period: 20s   
    
  redis_cache:
    image: redis:8.0-alpine
    container_name: redis_cache
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:     
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s    
      timeout: 5s   
      retries: 5     
      start_period: 5s
   
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      redis_cache:
        condition: service_healthy  
  
  seq:
    image: datalust/seq:latest
    container_name: articles-app-seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y  # Подтверждение лицензионного соглашения
      - SEQ_PASSWORD=${SEQ_PASSWORD}   
    ports:
     - "${SEQ_EXTERNAL_PORT}:80"
    volumes:
      - seq_data:/data 
    healthcheck: 
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  seq_data: